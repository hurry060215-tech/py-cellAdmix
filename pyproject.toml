[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pycelladmix"
version = "0.1.0"
description = "Python port of cellAdmix — evaluating and correcting cell admixtures in imaging-based spatial transcriptomics data"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Jonathan Mitchel", email = "mitchel@mit.edu"},
]
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "pandas>=1.3",
    "scikit-learn>=1.0",
    "anndata>=0.8",
    "scanpy>=1.9",
    "matplotlib>=3.5",
    "seaborn>=0.12",
    "scikit-image>=0.19",
    "sparse>=0.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

[tool.setuptools.packages.find]
include = ["celladmix*"]
